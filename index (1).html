*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;font-size:15px;padding:0 0 40px}
header{background:var(--pr);color:var(--pt);padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px 14px;border-radius:20px;cursor:pointer;font:inherit}
nav button.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--hl);border-radius:10px;padding:12px}.kpi small{color:var(--mu)}.kpi b{display:block;font-size:20px;margin-top:4px}
form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px;flex:1 1 130px}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0;width:100%}
button.b{background:var(--pr);color:var(--pt);border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font:inherit}
button.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:16px}
button.g{background:var(--card);color:var(--pt);border:1px solid var(--pt);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}
th{background:var(--pr);color:var(--pt);padding:8px;font-size:13px;text-align:center}
td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:center;font-size:14px}
tr.t td{background:var(--hl);font-weight:bold}
.n{direction:ltr;unicode-bidi:plaintext}.neg{color:var(--bad)}.pos{color:var(--ok)}.mu{color:var(--mu);font-size:13px}
.ro form,.ro .x,.ro .ed{display:none}.bar{height:10px;background:var(--hl);border-radius:6px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--ok)}textarea{min-width:220px}.warn{border:2px solid var(--bad)}.warn h2{color:var(--bad)}.warn div{padding:3px 0}.ed{background:none;border:0;cursor:pointer;font-size:15px;color:var(--pr)}button.g2{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:9px 14px;border-radius:8px;cursor:pointer;font:inherit}
td input{text-align:center;max-width:170px}
header span{font-size:12px;opacity:.85}

function stmtPage(k){const a=P[k],all=ledger(k),rows=all.filter(x=>!ui.sc||x.customer===ui.sc),last=rows.length&&ui.sc?rows[rows.length-1].bal:0,tdr=sum(rows,x=>x.dr),tcr=sum(rows,x=>x.cr);
 return `<div class="card"><h2>تسجيل سداد / رصيد افتتاحي</h2>${S[a.list].length?form(a.Y,[["date","التاريخ","date"],["customer",a.lb,S[a.list]],["type","النوع",["سداد","رصيد افتتاحي"]],["no","رقم المستند","","o"],["desc","البيان","","o"],["amount","المبلغ","number"]],'<label style="flex-direction:row;align-items:center;gap:6px;flex:0 0 auto"><input type="checkbox" name="tr" checked style="width:auto">تسجيل في الخزينة</label>'):noList(a.lb)}</div>
 <div class="card"><h2>كشف الحساب</h2><label style="max-width:260px;margin-bottom:10px">${a.lb}<select onchange="ui.sc=this.value;render()">${opts(S[a.list],"الكل")}</select></label>${tb(["التاريخ",a.lb,"الحركة","المستند","البيان","مدين","دائن","الرصيد",""],rows.map(x=>`<tr><td>${x.date}</td><td>${esc(x.customer)}</td><td>${x.type}</td><td>${esc(x.no)}</td><td>${esc(x.desc)}</td>${nd(x.dr?f(x.dr):"")}${nd(x.cr?f(x.cr):"")}${nd("<b>"+f(x.bal)+"</b>",cl(x.bal))}${x.id?acts(a.Y,x.id):"<td></td>"}</tr>`),`<tr class="t"><td colspan="5">${ui.sc?"الرصيد: "+f(last):"الإجمالي"}</td>${nd(f(tdr))}${nd(f(tcr))}${nd(f(tdr-tcr))}<td></td></tr>`)}<p class="mu">الفواتير والمشتريات تُعدَّل من تبويبها.</p></div>`}
function partyPage(k){const a=P[k],b=balances(k),t=x=>f(sum(b,r=>r[x]));
 return `<div class="card"><h2>إضافة ${a.lb}</h2><form onsubmit="addP(event,'${k}')"><label>الاسم<input name="n" required></label><button class="b">إضافة</button></form></div>
 <div class="card">${tb([a.lb,"رصيد افتتاحي",k==="c"?"الفواتير":"المشتريات","المرتجعات","السدادات","الرصيد",""],b.map((x,i)=>`<tr><td>${esc(x.n)}</td>${nd(f(x.o))}${nd(f(x.i))}${nd(f(x.r))}${nd(f(x.p))}${nd("<b>"+f(x.b)+"</b>",cl(x.b))}<td><button class="ed" onclick="renP('${k}',${i})">✎</button><button class="x" onclick="delP('${k}',${i})">✕</button></td></tr>`),`<tr class="t"><td>الإجمالي</td>${nd(t("o"))}${nd(t("i"))}${nd(t("r"))}${nd(t("p"))}${nd(t("b"))}<td></td></tr>`)}</div>`}
function addP(e,k){e.preventDefault();const n=new FormData(e.target).get("n").trim(),l=S[P[k].list];if(!n)return;if(l.includes(n)){al("الاسم موجود");return}l.push(n);save();render()}
function renP(k,i){const a=P[k],l=S[a.list],o=l[i],n=(prompt(T("الاسم الجديد"),o)||"").trim();if(!n||n===o)return;if(l.includes(n)){al("الاسم موجود");return}
 l[i]=n;[...S[a.L],...S[a.Y]].forEach(x=>{if(x.customer===o)x.customer=n});S.tre.forEach(x=>{if(x.party===o)x.party=n});save();render()}
function delP(k,i){const a=P[k],n=S[a.list][i];if([...S[a.L],...S[a.Y]].some(x=>x.customer===n)){al("لا يمكن حذف طرف له حركات. احذف حركاته أولًا.");return}if(cf("حذف؟")){S[a.list].splice(i,1);save();render()}}
function expList(){const dd=+S.warnDays||30;return stock().filter(x=>x.exp&&x.on>0).map(x=>({...x,d:Math.ceil((new Date(x.exp)-new Date(today))/864e5)})).filter(x=>x.d<=dd).sort((a,b)=>a.d-b.d)}
function expWarn(){const r=expList();
 return r.length?`<div class="card warn"><h2>⚠️ تنبيه: أصناف منتهية أو قاربت على الانتهاء (${r.length})</h2>${r.map(x=>`<div><b>${esc(x.name)}</b> — الكمية ${x.on} ${esc(x.unit)} — ${x.d<0?`<span class="neg">${T("منتهي منذ {n} يوم",{n:-x.d})}</span>`:x.d===0?`<span class="neg">${T("ينتهي اليوم")}</span>`:T("ينتهي خلال {n} يوم",{n:"<b>"+x.d+"</b>"})} (${x.exp})</div>`).join("")}</div>`:""}
function itm(){return `<div class="card"><h2>الأصناف</h2>${form("items",[["name","اسم الصنف"],["unit","الوحدة","","o"],["price","سعر البيع","number"],["cost0","تكلفة الشراء","number","o"],["qty0","رصيد أول المدة","number","o"],["prod","تاريخ الإنتاج","date","o"],["exp","تاريخ الانتهاء","date","o"]])}<p class="mu">عند عمل فاتورة اختر الصنف من القائمة ويُملأ السعر تلقائيًا (ويمكن تعديله). في المشتريات يُملأ سعر التكلفة.</p></div>
 <div class="card">${tb(["الصنف","الوحدة","سعر البيع","التكلفة","الإنتاج","الانتهاء","المتبقي",""],S.items.map(x=>{const d=x.exp?Math.ceil((new Date(x.exp)-new Date(today))/864e5):null;return `<tr><td>${esc(x.name)}</td><td>${esc(x.unit)}</td>${nd(f(x.price))}${nd(f(x.cost0))}<td>${x.prod||""}</td><td>${x.exp||""}</td><td class="${d!==null&&d<=(+S.warnDays||30)?"neg":""}">${d===null?"":d<0?"منتهي":T("{n} يوم",{n:d})}</td>${acts("items",x.id)}</tr>`}))}</div>`}
function stk(){const r=stock();return expWarn()+`<div class="card"><label style="max-width:260px">تنبيه الانتهاء قبل (يوم)<input type="number" value="${+S.warnDays||30}" onchange="S.warnDays=+this.value||30;save();render()"></label><p class="mu">الأصناف تُدار من تبويب «الأصناف». الرصيد يتحدث تلقائيًا: + المشتريات − المبيعات، والمرتجعات تعكسها.</p></div>
 <div class="card">${tb(["الصنف","الوحدة","أول المدة","مشتريات","مبيعات","الرصيد الحالي","متوسط التكلفة","القيمة","الانتهاء"],r.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.unit)}</td>${nd(x.o)}${nd(x.buy)}${nd(x.sold)}${nd("<b>"+x.on+"</b>",cl(x.on))}${nd(f(x.avg))}${nd(f(x.v))}<td>${x.exp||""}</td></tr>`),`<tr class="t"><td colspan="7">إجمالي قيمة المخزون</td>${nd(f(invVal()))}<td></td></tr>`)}</div>`}
function tre(){const rows=treRows(),ti=sum(S.tre,r=>r.in),to=sum(S.tre,r=>r.out),cats=["تحصيل من عميل","سداد لمورد","مشتريات","مرتبات","إيجار","مصروفات تشغيل","أخرى"];
 return `<div class="card"><h2>الخزينة</h2><div class="grid"><label>رصيد أول المدة<input type="number" step="any" value="${+S.open||0}" onchange="S.open=+this.value;save();render()"></label><div class="kpi"><small>الوارد</small><b class="n">${f(ti)}</b></div><div class="kpi"><small>المنصرف</small><b class="n">${f(to)}</b></div><div class="kpi"><small>رصيد الخزينة</small><b class="n ${cl(cash())}">${f(cash())}</b></div></div></div>
 <div class="card"><h2>حركة جديدة</h2>${form("tre",[["date","التاريخ","date"],["no","رقم الإيصال","","o"],["desc","البيان"],["party","الجهة","","o"],["cat","التصنيف",cats],["in","وارد","number","o"],["out","منصرف","number","o"]])}</div>
 <div class="card">${tb(["التاريخ","الإيصال","البيان","الجهة","التصنيف","وارد","منصرف","الرصيد",""],rows.map(r=>`<tr><td>${r.date}</td><td>${esc(r.no)}</td><td>${esc(r.desc)}</td><td>${esc(r.party)}</td><td>${esc(r.cat)}</td>${nd(r.in?f(r.in):"")}${nd(r.out?f(r.out):"")}${nd("<b>"+f(r.bal)+"</b>",cl(r.bal))}${acts("tre",r.id)}</tr>`),`<tr class="t"><td colspan="5">الإجمالي</td>${nd(f(ti))}${nd(f(to))}${nd(f(cash()))}<td></td></tr>`)}</div>`}
function bud(){const df=totA()-totL(),sec=s=>`<tr><th colspan="2" style="text-align:start">${s[0]}</th></tr>${s[1].map(x=>`<tr><td style="text-align:start">${x[1]}</td><td>${AUTO[x[0]]?`<span class="n" style="color:var(--ok)">${f(bv(x[0]))}</span> <span class="mu">(تلقائي)</span>`:`<input type="number" step="any" value="${S.bud[x[0]]??""}" onchange="S.bud['${x[0]}']=this.value;save();render()">`}</td></tr>`).join("")}<tr class="t"><td style="text-align:start">إجمالي ${s[0]}</td>${nd(f(secT(s)))}</tr>`;
 return `<div class="card"><h2>الميزانية العمومية التفصيلية</h2><div class="tw"><table style="min-width:420px">${sec(BUD[0])}${sec(BUD[1])}<tr class="t"><td style="text-align:start">إجمالي الأصول</td>${nd(f(totA()))}</tr>${sec(BUD[2])}${sec(BUD[3])}${sec(BUD[4])}<tr class="t"><td style="text-align:start">إجمالي الالتزامات وحقوق الملكية</td>${nd(f(totL()))}</tr><tr class="t"><td style="text-align:start">الفرق</td>${nd(f(df)+(Math.abs(df)<.005?" ✓ متوازنة":" غير متوازنة"),Math.abs(df)<.005?"pos":"neg")}</tr></table></div></div>`}
const JOBS=["مدير","محاسب","مبيعات","مشتريات","أمين مخزن","أمين خزينة","أخرى"];
const nm=id=>id==="local"?T("أنا"):ui.names[id]||(S.users[id]&&S.users[id].name)||"مستخدم";
function myRecs(){const all=["inv","pur","tre","pay","spay","items"].flatMap(x=>S[x]).filter(r=>r.by===ui.me);return [all.filter(r=>r.at===today).length,all.filter(r=>(r.at||"").slice(0,7)===today.slice(0,7)).length,all.length]}
function jobKpis(j){const d=docs("c"),ds=docs("s"),df=totA()-totL(),si=sum(d.filter(x=>x.type==="فاتورة"),x=>x.total),sr=sum(d.filter(x=>x.type==="مرتجع"),x=>x.total),sp=sum(ds.filter(x=>x.type==="شراء"),x=>x.total),c=x=>x.length+"",
 m={"مبيعات":[["عدد الفواتير",c(d.filter(x=>x.type==="فاتورة"))],["صافي المبيعات",f(si-sr)],["المرتجعات",f(sr)],["مستحقات العملاء",f(recv())],["عدد العملاء",S.cus.length+""]],
 "مشتريات":[["عدد فواتير الشراء",c(ds.filter(x=>x.type==="شراء"))],["إجمالي المشتريات",f(sp)],["مستحقات الموردين",f(pay())],["عدد الموردين",S.sup.length+""]],
 "أمين مخزن":[["عدد الأصناف",S.items.length+""],["قيمة المخزون",f(invVal())],["أصناف قاربت الانتهاء",expList().length+"","neg"],["أصناف نفد رصيدها",stock().filter(x=>x.on<=0).length+""]],
 "أمين خزينة":[["رصيد الخزينة",f(cash()),cl(cash())],["إجمالي الوارد",f(sum(S.tre,r=>r.in))],["إجمالي المنصرف",f(sum(S.tre,r=>r.out))],["عدد الحركات",S.tre.length+""]]};
 return m[j]||[["رصيد الخزينة",f(cash()),cl(cash())],["صافي المبيعات",f(si-sr)],["مستحقات العملاء",f(recv())],["مستحقات الموردين",f(pay())],["قيمة المخزون",f(invVal())],["فرق الميزانية",f(df),Math.abs(df)<.005?"pos":"neg"]]}
function home(){const id=ui.me,u=S.users[id]||{job:"",tasks:""},ts=(u.tasks||"").split("\n").map(x=>x.trim()).filter(Boolean),dn=(S.done[id+"|"+today]||[]).filter(i=>i<ts.length),[a,b,c]=myRecs(),pc=ts.length?Math.round(dn.length*100/ts.length):0;
 return expWarn()+`<div class="card"><h2>أهلًا بك يا ${esc(nm(id))} 👋</h2><p>${u.job?`وظيفتك: <b>${esc(u.job)}</b>`:'<span class="mu">لم تُحدَّد وظيفتك بعد. يحددها المسؤول من تبويب «المستخدمون».</span>'}</p><p class="mu">تاريخ اليوم: ${today}</p></div>
 <div class="card"><h2>مهامك اليومية</h2>${ts.length?ts.map((t,i)=>`<label style="flex-direction:row;align-items:center;gap:8px;color:var(--tx);font-size:15px;margin:6px 0"><input type="checkbox" style="width:auto" ${dn.includes(i)?"checked":""} ${canW?"":"disabled"} onchange="tick(${i})">${esc(t)}</label>`).join("")+`<div class="bar"><i style="width:${pc}%"></i></div><p class="mu">${T("أنجزت {a} من {b}",{a:dn.length,b:ts.length})} (${pc}%)</p>`:'<p class="mu">لا توجد مهام مسجّلة لك بعد.</p>'}</div>

 <div class="card"><h2>سجلّك أنت</h2><div class="grid"><div class="kpi"><small>سجلات أدخلتها اليوم</small><b>${a}</b></div><div class="kpi"><small>هذا الشهر</small><b>${b}</b></div><div class="kpi"><small>الإجمالي</small><b>${c}</b></div></div></div>`}
function tick(i){const k=ui.me+"|"+today;Object.keys(S.done).forEach(x=>{if(!x.endsWith("|"+today))delete S.done[x]});const a=S.done[k]||[];S.done[k]=a.includes(i)?a.filter(x=>x!==i):[...a,i];save();render()}
async function srch(){const q=$("sq").value.trim();ui.sq=q;ui.sr=[];if(q){try{const u=await claude.use("user");ui.sr=u?await u.search(q):[]}catch(e){}}render()}

 return `<div class="card"><h2>المستخدمون</h2><p>صلاحيتك الحالية: <b>${ui.who}</b></p><p class="mu">كل من تشاركه هذه الصفحة يظهر هنا تلقائيًا أول ما يفتح البرنامج. المسؤول يحدد وظيفة كل مستخدم ومهامه (كل مهمة في سطر)، فتظهر في شاشته الرئيسية مع لوحة إنجازات مناسبة لوظيفته.<br>لإضافة مستخدم: اضغط زر المشاركة (Share) للصفحة في Claude وأضف الشخص. صلاحية «Contributor» تسمح له بتسجيل وتعديل البيانات، و«Viewer» للمشاهدة فقط.<br>تنبيه: لو عدّل شخصان في نفس اللحظة تُحفظ آخر عملية.</p></div>

 <div class="card">${tb(["المستخدم","الوظيفة","المهام اليومية (كل مهمة في سطر)",""],ids.map((id,i)=>`<tr><td>${esc(nm(id))}</td><td><select ${ro} onchange="setU(${i},'job',this.value)"><option value="">— اختر —</option>${JOBS.map(j=>`<option value="${j}"${S.users[id].job===j?" selected":""}>${j}</option>`).join("")}</select></td><td><textarea rows="3" ${ro} onchange="setU(${i},'tasks',this.value)">${esc(S.users[id].tasks)}</textarea></td><td>${ui.admin?`<button class="x" onclick="delU(${i})">✕</button>`:""}</td></tr>`))}${ui.admin?"":'<p class="mu">التعديل متاح للمسؤول فقط.</p>'}</div>`}
render();stat("جاهز");
</script>
